# Plantilla de configuracion de la aplicacion RedAlerta Backend
spring.application.name=redalerta-backend
server.port=${PORT:8080}

# Prefix base de la API
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api/v1}

# Configuracion de Base de Datos (Soporta PostgreSQL en la nube u Oracle en local)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${ORACLE_USERNAME:jotape}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${ORACLE_PASSWORD:juandb}}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${DB_DRIVER:}}

# JPA / Hibernate (Deteccion automatica de dialecto para PostgreSQL u Oracle)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# JWT Security
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Multipart File Upload (Carga de evidencias)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# AWS S3 Storage
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:redalerta-evidencias}
aws.access-key=${AWS_ACCESS_KEY_ID:${AWS_ACCESS_KEY:}}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:${AWS_ACCESS_SECRET_KEY:${AWS_SECRET_KEY:}}}
aws.region=${AWS_REGION:us-east-1}

# Firebase Cloud Messaging
fcm.credentials-path=${FCM_CREDENTIALS_PATH:classpath:fcm-service-account.json}
