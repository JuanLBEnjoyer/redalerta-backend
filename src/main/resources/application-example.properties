# Plantilla de configuracion de la aplicacion RedAlerta Backend

# Esta plantilla de configuracion contiene valores de ejemplo para las propiedades de la aplicacion.
# Debes reemplazar los valores de ejemplo con tus propias configuraciones antes de ejecutar la aplicacion.
spring.application.name=redalerta-backend
server.port=8080

# Prefix base de la API
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api/v1}

# Configuración de Oracle DB
# Ejemplos según la versión que tengas instalada:
# - Oracle 23c Free (PDB por defecto): jdbc:oracle:thin:@localhost:1521/FREEPDB1
# - Oracle XE (18c/21c PDB):          jdbc:oracle:thin:@localhost:1521/XEPDB1
# - Oracle XE tradicional (SID):       jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=TU_USUARIO_ORACLE
spring.datasource.password=TU_CONTRASEÑA_ORACLE
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Security
jwt.secret=TU_CLAVE_SECRETA_JWT_MINIMO_256_BITS
jwt.expiration-ms=86400000

# AWS S3 Storage
aws.s3.bucket-name=TU_BUCKET_AWS_S3
aws.access-key=TU_AWS_ACCESS_KEY
aws.secret-key=TU_AWS_SECRET_KEY
aws.region=us-east-1

# Firebase Cloud Messaging
fcm.credentials-path=classpath:fcm-service-account.json
