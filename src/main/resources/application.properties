spring.application.name=redalerta-backend
server.port=8080

# Prefix base de la API
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api/v1}

# Configuración de Oracle DB
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USERNAME:jotape}
spring.datasource.password=${ORACLE_PASSWORD:juandb}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# JWT Security
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AWS S3 Storage
aws.s3.bucket-name=TU_BUCKET_AWS_S3
aws.access-key=TU_AWS_ACCESS_KEY
aws.secret-key=TU_AWS_SECRET_KEY
aws.region=us-east-1

# Firebase Cloud Messaging
fcm.credentials-path=classpath:fcm-service-account.json
