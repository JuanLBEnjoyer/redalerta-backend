spring.application.name=redalerta-backend
server.port=8080

# Prefix base de la API
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api/v1}

# Configuración de Oracle DB
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=jotape
spring.datasource.password=juandb
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Security
jwt.secret=7D4144F858634A0E8F1B9A6D3E7C8B9A
